[package]
name = "klepai"
version = "0.0.1"
description = "Klepai — self-hosted LLM manager"
edition = "2021"
rust-version = "1.82"

[lib]
name = "klepai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Capital-S binary so the macOS menu bar / Dock show "Klepai" in dev runs too
# (the process name comes from the executable filename).
[[bin]]
name = "Klepai"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# bundled = SQLite compiled from source, FTS5 enabled in the bundled build.
rusqlite = { version = "0.37", features = ["bundled"] }
# rustls-tls avoids a system OpenSSL dependency; ModelGateway is the only user.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# process + io-util drive the AgentRunner's headless CLI subprocesses.
tokio = { version = "1", features = ["rt", "time", "macros", "sync", "process", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.23.1"
tauri-plugin-opener = "2.5.5"
# In-app updates (issue #33): signed auto-update served from GitHub Releases,
# plus the relaunch helper that restarts the app after an update is applied.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# .skill packages are zips of a skill folder; deflate covers what owners ship.
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
