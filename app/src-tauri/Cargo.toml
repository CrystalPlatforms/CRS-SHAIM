[package]
name = "shaim"
version = "0.1.0"
description = "Shaim — self-hosted LLM manager"
edition = "2021"
rust-version = "1.82"

[lib]
name = "shaim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Capital-S binary so the macOS menu bar / Dock show "Shaim" in dev runs too
# (the process name comes from the executable filename).
[[bin]]
name = "Shaim"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# bundled = SQLite compiled from source, FTS5 enabled in the bundled build.
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
